<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Shark Bait theme badge -->
  <!-- Background circle -->
  <circle cx="32" cy="32" r="29" fill="#020c18" stroke="#1177cc" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Ocean waves -->
  <clipPath id="circleClip">
    <circle cx="32" cy="32" r="28"/>
  </clipPath>
  <g clip-path="url(#circleClip)">
    <!-- Water fill -->
    <rect x="4" y="36" width="56" height="28" fill="#062040" opacity="0.8"/>
    <!-- Wave 1 -->
    <path fill="#1177cc" opacity="0.5"
          d="M4,38 Q14,34 24,38 Q34,42 44,38 Q54,34 60,38 L60,64 L4,64 Z">
      <animate attributeName="d"
        values="M4,38 Q14,34 24,38 Q34,42 44,38 Q54,34 60,38 L60,64 L4,64 Z;
                M4,38 Q14,42 24,38 Q34,34 44,38 Q54,42 60,38 L60,64 L4,64 Z;
                M4,38 Q14,34 24,38 Q34,42 44,38 Q54,34 60,38 L60,64 L4,64 Z"
        dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- Shark body -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 4,1; 0,0; -3,-1; 0,0" dur="3s" repeatCount="indefinite"/>
      <!-- Body -->
      <ellipse cx="30" cy="33" rx="14" ry="6" fill="#3a5a7a"/>
      <!-- Tail fin -->
      <polygon points="16,33 8,27 8,39" fill="#2a4a6a"/>
      <!-- Dorsal fin -->
      <polygon points="26,27 30,19 34,27" fill="#3a5a7a"/>
      <!-- Eye -->
      <circle cx="41" cy="31" r="1.5" fill="#ffffff"/>
      <circle cx="41.5" cy="31" r="0.8" fill="#111"/>
      <!-- Mouth / bite mark -->
      <path d="M43,34 Q45,36 43,38" fill="none" stroke="#cc1133" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <!-- Blood drops -->
    <circle cx="46" cy="40" r="1.2" fill="#cc1133" opacity="0.8">
      <animate attributeName="cy" values="40;50;40" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="42" r="0.9" fill="#aa0022" opacity="0.7">
      <animate attributeName="cy" values="42;54;42" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
