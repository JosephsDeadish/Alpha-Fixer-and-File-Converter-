name: Fresh Machine Runtime Validation

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-runtime:
    name: Packaged runtime – ${{ matrix.os }} – ${{ matrix.bundle_kind }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        bundle_kind: [folder, onefile]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install_linux_deps.sh

      - name: Build packaged app (Linux/macOS)
        if: runner.os != 'Windows' && matrix.bundle_kind == 'folder'
        run: bash scripts/build_exe.sh

      - name: Build packaged app (Windows)
        if: runner.os == 'Windows' && matrix.bundle_kind == 'folder'
        shell: cmd
        run: scripts\build_exe.bat

      - name: Build packaged app one-file (Linux/macOS)
        if: runner.os != 'Windows' && matrix.bundle_kind == 'onefile'
        run: bash scripts/build_exe.sh --onefile

      - name: Build packaged app one-file (Windows)
        if: runner.os == 'Windows' && matrix.bundle_kind == 'onefile'
        shell: cmd
        run: scripts\build_exe.bat --onefile

      - name: Verify packaged app (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.bundle_kind }}" == "onefile" ]]; then
            launch_target="dist/AlphaFixerConverter"
          else
            launch_target="dist/AlphaFixerConverter/AlphaFixerConverter"
          fi
          python scripts/verify_packaged_app.py \
            "$launch_target" \
            --bundle-kind ${{ matrix.bundle_kind }} \
            --smoke-seconds 2 \
            --repeat 3 \
            --smoke-launch-delay-seconds 0.5 \
            --timeout 45 \
            --max-smoke-elapsed-seconds 30 \
            --max-smoke-elapsed-growth-seconds 10 \
            --max-smoke-elapsed-spread-seconds 10 \
            --run-selftest \
            --selftest-iterations 6 \
            --selftest-sample-limit 4 \
            --selftest-stress-loops 3 \
            --repeat-selftest-runs 2 \
            --max-selftest-rss-growth-mb 256 \
            --max-selftest-rss-spread-mb 256 \
            --require-selftest-pass \
            --require-core-selftest-checks \
            --require-video-selftest-checks \
            --require-stress-selftest-checks \
            --require-public-manifest-checks \
            --require-public-manifest-group-checks \
            --use-public-sample-manifests \
            --allow-sample-downloads \
            --sample-cache-dir artifacts/sample-cache \
            --require-video-runtime \
            --require-ffmpeg-selfcheck \
            --require-ffprobe-selfcheck \
            --require-bundled-ffmpeg \
            --require-bundled-ffprobe \
            --require-bundled-default-theme-svg \
            --require-packaged-bundle-ready \
            --require-no-missing-libs \
            --json-out artifacts/runtime-validation-${{ runner.os }}-${{ matrix.bundle_kind }}.json

      - name: Verify packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          if ("${{ matrix.bundle_kind }}" -eq "onefile") {
            $launchTarget = "dist\AlphaFixerConverter.exe"
          } else {
            $launchTarget = "dist\AlphaFixerConverter\AlphaFixerConverter.exe"
          }
          python scripts/verify_packaged_app.py `
            $launchTarget `
            --bundle-kind ${{ matrix.bundle_kind }} `
            --smoke-seconds 2 `
            --repeat 3 `
            --smoke-launch-delay-seconds 0.5 `
            --timeout 45 `
            --max-smoke-elapsed-seconds 30 `
            --max-smoke-elapsed-growth-seconds 10 `
            --max-smoke-elapsed-spread-seconds 10 `
            --run-selftest `
            --selftest-iterations 6 `
            --selftest-sample-limit 4 `
            --selftest-stress-loops 3 `
            --repeat-selftest-runs 2 `
            --max-selftest-rss-growth-mb 256 `
            --max-selftest-rss-spread-mb 256 `
            --require-selftest-pass `
            --require-core-selftest-checks `
            --require-video-selftest-checks `
            --require-stress-selftest-checks `
            --require-public-manifest-checks `
            --require-public-manifest-group-checks `
            --use-public-sample-manifests `
            --allow-sample-downloads `
            --sample-cache-dir artifacts/sample-cache `
            --require-video-runtime `
            --require-ffmpeg-selfcheck `
            --require-ffprobe-selfcheck `
            --require-bundled-ffmpeg `
            --require-bundled-ffprobe `
            --require-bundled-default-theme-svg `
            --require-packaged-bundle-ready `
            --require-no-missing-libs `
            --json-out artifacts\runtime-validation-windows-${{ matrix.bundle_kind }}.json

      - name: Upload runtime validation report
        uses: actions/upload-artifact@v4
        with:
          name: runtime-validation-${{ matrix.os }}-${{ matrix.bundle_kind }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
