name: Build Windows Executable

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: PyInstaller – Windows x64 – ${{ matrix.bundle_kind }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        bundle_kind: [folder, onefile]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Provision native release runtimes
        shell: pwsh
        run: |
          choco install ffmpeg imagemagick -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $magick = Get-ChildItem "C:\Program Files" -Directory -Filter "ImageMagick*" | Select-Object -First 1
          if (-not $magick) { throw "ImageMagick installation not found" }
          "MAGICK_HOME=$($magick.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Add-Content -Path $env:GITHUB_PATH -Value $magick.FullName
          Add-Content -Path $env:GITHUB_PATH -Value "C:\ProgramData\chocolatey\bin"

      - name: Read app version
        id: appver
        shell: pwsh
        run: |
          $ver = python -c "exec(open('src/version.py').read()); print(__version__)"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build release
        shell: cmd
        run: scripts\build_exe.bat ${{ matrix.bundle_kind == 'onefile' && '--onefile' || '' }}

      - name: Verify release without host runtime tools
        shell: pwsh
        run: |
          if ("${{ matrix.bundle_kind }}" -eq "onefile") {
            $exe = "dist\AlphaFixerConverter.exe"
          } else {
            $exe = "dist\AlphaFixerConverter\AlphaFixerConverter.exe"
          }
          python scripts/verify_packaged_app.py $exe `
            --bundle-kind ${{ matrix.bundle_kind }} --offline-runtime `
            --smoke-seconds 2 --timeout 90 --run-selftest `
            --require-selftest-pass --require-core-selftest-checks `
            --require-video-selftest-checks --require-dds-selftest-checks `
            --require-video-runtime --require-ffmpeg-selfcheck --require-ffprobe-selfcheck `
            --require-bundled-ffmpeg --require-bundled-ffprobe `
            --require-wand-runtime --require-bundled-imagemagick `
            --require-bundled-default-theme-svg --require-packaged-bundle-ready `
            --require-no-packaged-asset-gaps `
            --json-out dist\validation-reports\release-offline-${{ matrix.bundle_kind }}.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AlphaFixerConverter-Windows-${{ matrix.bundle_kind }}-v${{ steps.appver.outputs.version }}
          path: |
            dist/AlphaFixerConverter/
            dist/AlphaFixerConverter.exe
            dist/validation-reports/
          retention-days: 90
          if-no-files-found: error
